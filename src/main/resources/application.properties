# Application Identity
spring.application.name=po-processor
server.port=8085
server.servlet.context-path=/scm

# DataSource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/scm_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.pool-name=ScmHikariPool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SCM Directory and File Configuration
scm.path.inbox=E:/SCM/INBOX
scm.path.outbox=E:/SCM/OUTBOX
scm.file.excel-name=PO_SCM.xlsx
scm.file.xml-output=PO_OUTPUT.xml

# Logging
logging.level.id.co.edi.scm=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
